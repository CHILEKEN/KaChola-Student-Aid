<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KaChola Student Aid</title>
    <style>
        :root {
            --primary-color: #964B00;
            --accent-color: #FFD700;
            --background-color: #F5F5DC;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background-color);
        }

        header {
            background-color: var(--primary-color);
            color: #fff;
            padding: 1rem;
            text-align: center;
        }

        header nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        header nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
        }

        header nav li {
            margin-right: 20px;
        }

        header nav a {
            color: #fff;
            text-decoration: none;
        }

        .hero {
            background-image: linear-gradient(to bottom, var(--primary-color), var(--accent-color));
            padding: 5rem;
            text-align: center;
            color: #fff;
        }

        button {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background-color: #fff;
            color: var(--accent-color);
        }

        form {
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        label {
            display: block;
            margin-bottom: 10px;
        }

        input {
            width: 100%;
            height: 40px;
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid #ccc;
        }

        .error-message {
            color: red;
            font-size: 14px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <img src="logo.png" alt="KaChola Student Aid logo" width="50" height="50">
            </div>
            <h1>KaChola Student Aid</h1>
            <ul>
                <li><a href="                          
                <li><a href="#my-applications">MY APPLICATIONS</a></li>
                <li><a href="                                        
                <li><a href="#contact">CONTACT</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="hero">
            <h2>Empowering Students with Financial Aid</h2>
            <p>Get the support you need to achieve your academic goals</p>
            <button>APPLY NOW</button>
        </section>

        <section id="apply">
            <h2>Apply for a Loan</h2>
            <form id="loan-form" action="https:                                          
                <input type="hidden" name="access_key" value="fe293e23-d328-4bad-86e8-d9b531e2a37d">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <label for="amount">Loan Amount:</label>
                <input type="number" id="amount" name="amount" required>
                <button type="submit">SUBMIT APPLICATION</button>
            </form>
        </section>

        <section id="my-applications">
            <h2>My Applications</h2>
            <!-- Display applications here -->
        </section>
        <section id="interest-rates">
            <h2>Interest Rates</h2>
            <!-- Display interest rates here -->
        </section>
        <section id="contact">
            <h2>Contact Us</h2>
            <!-- Contact form or info here -->
        </section>
    </main>
    <script>
        const form = document.getElementById('loan-form');

        form.addEventListener('submit', (e) => {
            const inputs = form.querySelectorAll('input');
            let isValid = true;

            inputs.forEach((input) => {
                if (!input.value.trim()) {
                    isValid = false;
                    input.style.border = '1px solid red';
                    const errorMessage = document.createElement('div');
                    errorMessage.textContent = `Please fill in ${input.placeholder || input.name}`;
                    errorMessage.classList.add('error-message');
                    input.parentNode.appendChild(errorMessage);
                }
            });

            if (!isValid) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
